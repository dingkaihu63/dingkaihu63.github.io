<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Dingkai Hu</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-title-zh="页面不存在 · 胡定锴" data-title-en="Page not found · Dingkai Hu">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-logo" href="/">
          <span class="site-logo__mark" aria-hidden="true">胡</span>
          <span class="site-logo__text">
            <span data-lang="zh">胡定锴</span>
            <span data-lang="en">Dingkai Hu</span>
          </span>
        </a>
        <div class="header-right">
          <a class="blog-back" href="/">
            <span aria-hidden="true">←</span>
            <span data-lang="zh">返回主页</span>
            <span data-lang="en">Home</span>
          </a>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" id="lang-zh" aria-pressed="false">中文</button>
            <button type="button" id="lang-en" aria-pressed="true">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main class="blog-wrap">
      <p class="cv-card__lang">404</p>
      <h1 class="blog-title">
        <span data-lang="zh">这个页面不存在</span>
        <span data-lang="en">This page does not exist</span>
      </h1>
      <p class="blog-intro">
        <span data-lang="zh">链接可能已经失效，或者地址打错了。可以从主页重新开始。</span>
        <span data-lang="en">The link may be out of date, or the address has a typo. You can start again from the homepage.</span>
      </p>
      <p class="more">
        <a class="more__link" href="/">
          <span data-lang="zh">回到主页</span>
          <span data-lang="en">Back to homepage</span>
          <span aria-hidden="true">→</span>
        </a>
      </p>

      <p class="blog-foot">
        <span>© <span id="year">2026</span></span>
        <span aria-hidden="true">·</span>
        <span data-lang="zh">胡定锴 · 同济大学</span>
        <span data-lang="en">Dingkai Hu · Tongji University</span>
      </p>
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
